# R CMD check and BiocCheck on a fresh R installation for each platform, so
# that missing or wrongly declared dependencies show up as install failures.
name: R-CMD-check-bioc

on:
  push:
    branches: [main, master, release-prep]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,  r: 'release'}
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      # Resolves CRAN and Bioconductor dependencies (the package has biocViews)
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, bioc::BiocCheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual")'
          error-on: '"warning"'
          upload-snapshots: true

      - name: BiocCheck
        if: runner.os == 'Linux'
        shell: Rscript {0}
        run: |
          BiocCheck::BiocCheck(
            ".",
            `quit-with-status` = TRUE,
            `no-check-bioc-help` = TRUE
          )
